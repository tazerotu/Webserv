server {
name localhost1
host 127.0.0.1
port 8080
client_max_body 1000000
error_page 404 /pages/error/404.html
# error_page 401 /pages/error/401.html
# error_page 402 /pages/error/402.html
# error_page 403 /pages/error/403.html


	route / {
		name /
		allowed_methods GET
		
		root /home/ttas/Webserv/pages/Alps/
		index /home/ttas/Webserv/pages/Alps/index.html
		upload FALSE
		autoindex FALSE

		cgi_path /home/ttas/Webserv/pages/Alps/cgi-bin/
		cgi_ext .php
	}

# To do	
	route /upload {
		name /upload
		allowed_methods GET POST DELETE

		root /home/ttas/Webserv/pages/Alps/upload/
		index /home/ttas/Webserv/pages/Alps/upload/upload.php
		upload FALSE
		autoindex TRUE

		cgi_path /home/ttas/Webserv/pages/Alps/cgi-bin/
		cgi_ext .php
	}

}

