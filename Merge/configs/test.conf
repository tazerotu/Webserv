server {
	server_name localhost1
	host 127.0.0.1
	port 8080
	client_max_body 100

	error_page 404 ./pages/Alps/error/404.html
	error_page 400 ./pages/Alps/error/400.html
	error_page 403 ./pages/Alps/error/403.html
	error_page 500 ./pages/Alps/error/500.html
	error_page 503 ./pages/Alps/error/503.html

	# / must answer to GET request ONLY
	route / {
		route_name /
		allowed_methods GET

		root /pages/Alps/
		index index.html
		upload_status 0
		autoindex 0
	}

	# Any file with .bla must answer to POST request using cgi_test
	route /bla_cgi {
		route_name /bla_cgi
		allowed_methods POST

		root /
		index index.html
		upload_status 0
		autoindex 0

		cgi_path ./cgi_tester
		cgi_ext .bla
	}

	# /post_body must answer to POST with maxBody 100
	route /post_body {
		route_name /post_body
		allowed_methods POST

		root /
		index index.html
		upload_status 0
		autoindex 0
		# client_max_body 100
	}

	# /directory/ must answer to GET
	# root = repository YoupiBanane
	# if no file requested, search for youpi.bad_extension
	route /directory/ {
		route_name /directory/
		allowed_methods GET

		root /YoupiBanane/
		index youpi.bad_extension
		upload_status 0
		autoindex 0
	}
}
